<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>Snake</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #app { position: relative; width: 1280px; height: 720px; }
    canvas { display: block; }
    #ad-container {
      position: absolute;
      inset: 0;
      display: none;
      background: #000;
    }
    #ad-video { width: 100%; height: 100%; }
    #prompt-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font: 32px sans-serif;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }
    #prompt-overlay.visible { display: flex; }
  </style>
  <script src="https://imasdk.googleapis.com/js/sdkloader/ima3.js"></script>
</head>
<body>
  <div id="app">
    <canvas id="game-canvas" width="1280" height="720"></canvas>
    <div id="ad-container"><video id="ad-video"></video></div>
    <div id="prompt-overlay">
      <p id="prompt-text"></p>
      <p style="font-size: 18px; opacity: 0.7;">Enter — Yes | Escape — No</p>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
